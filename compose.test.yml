services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: attendance_test
      POSTGRES_USER: attendance_test
      POSTGRES_PASSWORD: attendance_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_test -d attendance_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

