[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-service"
version = "0.1.0"
description = "Idempotent eSSL attendance device synchronization to PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.116,<1",
    "jinja2>=3.1,<4",
    "openpyxl>=3.1,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "pyzk>=0.9,<1",
    "SQLAlchemy>=2.0,<3",
    "tzdata>=2025.2",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
]

[project.scripts]
attendance-service = "attendance_service.backend.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
attendance_service = ["frontend/templates/*.html", "frontend/static/*.css", "frontend/static/*.js"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
testpaths = ["tests"]
pythonpath = ["src"]
